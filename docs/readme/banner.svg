    <ellipse cx="1016" cy="125" rx="299" ry="204" fill="url(#glow)"/>
    <rect x="803" width="397" height="260" fill="url(#dots)" opacity=".51"/>
    <path d="M769 224h77l41-42h83M807 55h81l27 27h118m-92 94h128l45-45h102" fill="none" stroke="#5FA7DE" stroke-opacity=".29" stroke-width="2"/>
