    <circle cx="887" cy="55" r="4" fill="#7DD6FF" opacity=".76"/>
    <circle cx="1114" cy="131" r="4" fill="#7DD6FF" opacity=".76"/>
    <rect x="932" y="40" width="170" height="170" rx="31" fill="#101C31" fill-opacity=".86" stroke="#5FA7DE" stroke-opacity=".56"/>
    <rect x="945" y="53" width="144" height="144" rx="24" fill="none" stroke="#5FA7DE" stroke-opacity=".23"/>
    <g transform="translate(948 56) scale(.85)" fill="none" stroke="#7DD6FF" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"><path d="m28 67 53-32 53 32-53 32Z M28 84l53 32 53-32 M28 101l53 32 53-32"/><path d="M81 99v34" opacity=".55"/></g>
