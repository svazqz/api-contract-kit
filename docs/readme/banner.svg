<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="project-title project-description">
  <title id="project-title">API Contract Kit</title>
  <desc id="project-description">One contract for servers, clients, and docs.</desc>
  <defs>
    <linearGradient id="background">
      <stop offset="0" stop-color="#101C31"/>
      <stop offset="1" stop-color="#122F4C"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7DD6FF" stop-opacity=".23"/>
      <stop offset="1" stop-color="#7DD6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
